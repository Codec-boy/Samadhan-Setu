services:
  - type: web
    name: samadhansetu
    runtime: python
    region: oregon
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn --chdir backend backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_SECURE_COOKIES
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: samadhansetu-db
          property: connectionString

databases:
  - name: samadhansetu-db
    region: oregon
    plan: free
    databaseName: samadhansetu
    user: samadhansetu
